macros:
 - name: cent_to_dollar
   description: "Converts a column from cents to dollars"
   arguments:
     - name: column_name
       description: "The name of the column to convert"
       type: string
     - name: decimals
       description: "The number of decimal places to round to (default is 4)"
       type: integer
   returns:
     description: "A SQL expression that converts the specified column from cents to dollars and rounds it to the specified number of decimal places."
     type: string
 - name: grant_select 
   description: "Generates a SQL statement to grant SELECT privileges on a specified table to a specified role."
   arguments:
     - name: schema_name
       description: "The name of the schema containing the table"
       type: string
     - name: role_name
       description: "The name of the role to grant SELECT privileges to"
       type: string
     - name: database_name
       description: "The name of the database containing the schema and table"
       type: string
   returns:
     description: "A SQL statement that grants SELECT privileges on the specified table to the specified role."
     type: string   
     