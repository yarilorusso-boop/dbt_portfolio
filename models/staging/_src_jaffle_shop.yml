version: 2

sources:
  - name: jaffle_shop    # <--- Verifica che ci sia questo trattino seguito da NAME
    description: A clone of a Postgres database
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customers data
        columns: 
         - name: id
           description: primary key
           data_tests:
           - unique
           - not_null
      - name: orders
        config:
          freshness:
            warn_after: 
              count: 70000
              period:  hour
            error_after:
              count:  90000
              period:  hour
          loaded_at_field:  _etl_loaded_at
